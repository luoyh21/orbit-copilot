[package]
name = "orbit-copilot"
version = "0.4.4"
description = "Offline-first orbital operations copilot"
authors = ["STARMAD"]
edition = "2021"

[lib]
name = "orbit_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Rust's official Win7 target reports target_vendor="win7". ctor 0.8.0 only
# recognizes target_vendor="pc" for Windows COFF initialization sections, so
# use the audited local patch until the upstream crate supports the Win7 target.
[patch.crates-io]
ctor = { path = "vendor/ctor" }
# Keep the generated COM bindings used by Tauri/Wry, but pin the native
# WebView2 Loader to Microsoft's final Win7-compatible SDK (1.0.1518.46).
webview2-com-sys = { path = "vendor/webview2-com-sys" }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
rfd = "0.17"
rust_xlsxwriter = "0.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(target_vendor = "win7"))'.dependencies]
tauri-plugin-notification = "2.3.3"

[target.'cfg(target_vendor = "win7")'.dependencies]
# The dedicated Win7 target is release-only. Force Tauri's embedded asset
# protocol at the dependency level so a direct Cargo/xwin build can never fall
# back to the localhost development URL.
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
win7-notifications = "0.4.5"
